function render(){canvas.dataset.generation=state.generation;canvas.dataset.population=count(state.cells);canvas.dataset.running=state.running;canvas.dataset.mode=state.mode;canvas.dataset.index=currentIndex();canvas.dataset.backups=backups.length;canvas.dataset.custom=Object.keys(custom).length;canvas.dataset.theme=state.theme;canvas.dataset.brush=state.brush;canvas.dataset.busy=busy;canvas.dataset.page=page;canvas.dataset.preview=preview?count(preview):-1;canvas.dataset.saveState=saveState;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;ctx.imageSmoothingEnabled=false;ctx.fillStyle=theme().bg;ctx.fillRect(0,0,screenW,screenH);drawWorld();if(panelVisible)drawPanel();else{layout.x=screenW-48;layout.y=screenH-48;layout.u=1;region('show',0,0,36,36,'显示右侧面板',()=>{panelVisible=true;resize();});uiText(10,9,'+',3,theme().muted);}syncRegions();dirty=false;}
function animate(t){requestAnimationFrame(animate);if(document.hidden){lastTick=t;lastPaint=t;return;}if(state.running&&!pointer&&!loading&&!busy&&t-lastTick>=1000/state.speed){step();lastTick=t;}else if(!state.running||pointer||busy)lastTick=t;const now=new Date(),second=now.toISOString().slice(0,19);if(second!==lastSecond){lastSecond=second;$('clock').dateTime=now.toISOString();$('clock').textContent=now.toLocaleString('zh-CN',{hour12:false});$('metrics').textContent='代数 '+state.generation+'，活细胞 '+count(state.cells)+'，预设 '+state.preset+'，随机种子 '+state.seed+'，被替换预设备份 '+backups.length;dirty=true;}if(t-lastPaint>=1000/30){let fading=false;for(let i=0;i<L;i++)if(state.fade[i]>.015){state.fade[i]*=.88;fading=true;}if(dirty||fading||feedbackUntil>t)render();lastPaint=t;}}
function point(e){if(e.clientX>=layout.sideX)return null;const x=Math.floor((e.clientX-bounds.x)/bounds.s),y=Math.floor((e.clientY-bounds.y)/bounds.s);return x>=0&&x<W&&y>=0&&y<H?{x,y,erase:e.button===2||e.buttons===2||e.shiftKey}:null;}

function paintLine(a,b){if(!a||!b)return;const n=Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y));for(let i=0;i<=n;i++)paintAt({x:Math.round(a.x+(b.x-a.x)*(n?i/n:0)),y:Math.round(a.y+(b.y-a.y)*(n?i/n:0))});}

async function exportSelected(){try{if(page==='backups'){const b=backups[backupIndex];if(b)download(b.file,'P'+String(b.file[8]).padStart(3,'0')+'_replaced_'+b.replacedAt+'.life');}else{const index=currentIndex(),file=state.mode==='preset'&&custom[index]?custom[index]:await encodePreset(await selectedCells(),index,0);download(file,(state.mode==='preset'?'P':'R')+String(index).padStart(3,'0')+'.life');}notify('check','已导出紧凑预设文件');}catch{notify('error','导出失败');}}
async function encodeBank(){const out=[76,66,75,51],slots=Object.entries(custom).sort((a,b)=>Number(a[0])-Number(b[0]));putVar(out,slots.length);for(const [,file]of slots){putVar(out,file.length);out.push(...file);}putVar(out,backups.length);for(const b of backups){const time=Math.floor(b.replacedAt/1000);out.push(time&255,(time>>>8)&255,(time>>>16)&255,(time>>>24)&255);putVar(out,b.file.length);out.push(...b.file);}const raw=Uint8Array.from(out),file=new Uint8Array(raw.length+4);file.set(raw);new DataView(file.buffer).setUint32(raw.length,crc32(raw),true);const zipped=await compress(file);return zipped&&zipped.length<file.length?zipped:file;}
async function decodeBank(input){let data=input instanceof Uint8Array?input:new Uint8Array(input);if(data.length>16*1024*1024)throw Error('bank limit');if(data[0]===31&&data[1]===139)data=await decompress(data,32*1024*1024);if(data.length<10||String.fromCharCode(...data.subarray(0,4))!=='LBK3')throw Error('bank');const end=data.length-4;if(new DataView(data.buffer,data.byteOffset).getUint32(end,true)!==crc32(data.subarray(0,end)))throw Error('checksum');const cur={i:4},out={},old=[],n=readVar(data,cur);if(n>256)throw Error('slots');for(let i=0;i<n;i++){const len=readVar(data,cur);if(len<18||cur.i+len>end)throw Error('bank length');const file=data.slice(cur.i,cur.i+len);cur.i+=len;const decoded=await decodePreset(file);if(out[decoded.index])throw Error('duplicate slot');out[decoded.index]=file;}const m=readVar(data,cur);if(m>50000)throw Error('backup limit');for(let i=0;i<m;i++){if(cur.i+4>end)throw Error('time');const replacedAt=new DataView(data.buffer,data.byteOffset).getUint32(cur.i,true)*1000;cur.i+=4;const len=readVar(data,cur);if(len<18||cur.i+len>end)throw Error('backup length');const file=data.slice(cur.i,cur.i+len);cur.i+=len;await decodePreset(file);old.push({file,replacedAt});}if(cur.i!==end)throw Error('trailing');return {custom:out,backups:old};}
async function exportBank(){try{download(await encodeBank(),'life-bank_'+Date.now()+'.lifebank');notify('check','已导出全部自定义预设和被替换预设');}catch{notify('error','导出预设库失败');}}
async function mergeBank(bank){const proposed={...custom},old=[...backups],seenBackups=new Set(old.map(b=>b.replacedAt+':'+crc32(b.file)));for(const [key,file]of Object.entries(bank.custom)){const index=Number(key),incoming=(await decodePreset(file)).cells,existing=await slotCells(index);if(sameCells(incoming,existing)){if(!custom[index])proposed[index]=file;continue;}if(custom[index]||count(existing)>0){const prior=custom[index]||await encodePreset(existing,index,0);old.push({file:prior,replacedAt:Math.floor(Date.now()/1000)*1000});}proposed[index]=file;}for(const b of bank.backups){const key=b.replacedAt+':'+crc32(b.file);if(!seenBackups.has(key)){old.push(b);seenBackups.add(key);}}const priorCustom=custom,priorBackups=backups;custom=proposed;backups=old;try{await persistBank(true);}catch(e){custom=priorCustom;backups=priorBackups;throw e;}decodedCache.clear();}
$('importFile').onchange=async()=>{const file=$('importFile').files[0];if(!file)return;endStroke();busy=true;dirty=true;try{if(file.size>16*1024*1024)throw Error('limit');const data=new Uint8Array(await file.arrayBuffer());if(String.fromCharCode(...data.subarray(0,4))==='LIF3'){const decoded=await decodePreset(data);state.mode='preset';state.preset=decoded.index;state.cells=decoded.cells;state.generation=0;state.running=false;page='bank';resetVisual();notify('check','已导入游戏区；点击保存可写入预设');}else{await mergeBank(await decodeBank(data));page='bank';notify('check','已合并预设库；被替换预设已保留');}await refreshPreview();}catch{notify('error','导入失败，原有预设未改变');}finally{busy=false;dirty=true;$('importFile').value='';}};

async function persistBank(required=false){if(!db||loading){if(required)throw Error('storage unavailable');return;}if(saving){saveAgain=true;if(required){await new Promise(resolve=>{const wait=()=>saving?setTimeout(wait,10):resolve();wait();});return persistBank(true);}return;}saving=true;try{const data=bankData();await new Promise((resolve,reject)=>{const tx=db.transaction('state','readwrite');tx.objectStore('state').put(data,'bank');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});saveState='saved';}catch(e){saveState='error';notify('error','预设保存失败，请导出预设库备份');throw e;}finally{saving=false;dirty=true;if(saveAgain){saveAgain=false;scheduleSave();}}}
async function initStorage(){try{db=await new Promise((resolve,reject)=>{const req=indexedDB.open('conway-preset-bank-v3',1);req.onupgradeneeded=()=>req.result.createObjectStore('state');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(Error('blocked'));});const data=await new Promise((resolve,reject)=>{const req=db.transaction('state').objectStore('state').get('bank');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});if(data?.version===3){custom=data.custom&&typeof data.custom==='object'?data.custom:{};backups=Array.isArray(data.backups)?data.backups:[];const s=data.settings||{};state.speed=SPEEDS.includes(s.speed)?s.speed:12;state.brush=[1,3,5].includes(s.brush)?s.brush:1;state.theme=s.theme==='day'||s.theme==='night'?s.theme:state.theme;state.mode=s.mode==='random'?'random':'preset';state.preset=Number.isInteger(s.preset)&&s.preset>=0&&s.preset<=255?s.preset:1;state.seed=Number.isInteger(s.seed)&&s.seed>=0&&s.seed<=255?s.seed:42;state.trails=s.trails!==false;}state.cells=(state.mode==='random'?randomCells(state.seed):await slotCells(state.preset)).slice();resetVisual();saveState='saved';}catch{saveState='error';notify('error','本地存储不可用，仍可运行和导出');}finally{loading=false;state.running=wallpaperMode;refreshPreview();dirty=true;}}
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.target.matches('input')||loading||busy)return;const key=e.key.toLowerCase();if(e.code==='Space'&&!e.target.matches('button')){e.preventDefault();endStroke();toggleRun();}if(key==='n'){endStroke();state.running=false;step();}if(key==='h'){endStroke();panelVisible=!panelVisible;resize();}if(e.key==='Escape'){panelVisible=true;resize();}if(key==='t'){state.theme=state.theme==='night'?'day':'night';scheduleSave();dirty=true;}if(key==='m'){toggleMode();}if(key==='s')savePreset();if(key==='l')loadSelected();if(key==='b')exportBank();if(key==='e')exportEditor();if(key==='d')downloadApp();if(key==='[')setIndex(currentIndex()-1);if(key===']')setIndex(currentIndex()+1);if(key==='+'||key==='='){state.speed=SPEEDS[Math.min(4,SPEEDS.indexOf(state.speed)+1)];scheduleSave();dirty=true;}if(key==='-'){state.speed=SPEEDS[Math.max(0,SPEEDS.indexOf(state.speed)-1)];scheduleSave();dirty=true;}});
